services:
  vulcanexus:
    image: custom_vulcanexus
    hostname: DDS_host
    container_name: pcbinfo
    build: 
      context: .
      dockerfile: build/custom_vulcanexus/Dockerfile
    networks:
      - mynet
    privileged: true
    ipc: host
    command: sleep infinity
    environment:
      DISPLAY: "$DISPLAY"
    volumes:
       - ./configs/ros2_pkgs/control_station_ws/src:/control_station_ws/src
       - /tmp/.X11-unix:/tmp/.X11-unix
    ports:
      # FastApi server for the pcb_images
      - 5000:5000


  mongo_db:
    image: mongo:4.4
    hostname: mongo_host
    container_name: mongo_db
    networks:
      - mynet
    privileged: true
    ipc: host
    command: --bind_ip_all
    volumes:
      - mongo_data:/data/db
    ports:
      - 27017:27017

  orion_ld:
    image: fiware/orion-ld:1.9.0
    hostname: orion_host
    container_name: orion
    networks:
      - mynet
    privileged: true
    ipc: host
    command: -dbhost mongo_db -logLevel DEBUG -wip dds -mongocOnly # -forwarding -experimental
    environment:
      - ORIONLD_MONGO_HOST=mongo_db
      - ORIONLD_TROE=TRUE
      - ORIONLD_TROE_HOST=timescale
      - ORIONLD_TROE_PORT=5432
      - ORIONLD_TROE_USER=orion
      - ORIONLD_TROE_PWD=orion
    volumes:
       - ./configs/contextbroker/config-ddsv2.json:/root/.orionld
    depends_on:
      - mongo_db
    ports:
      - 1026:1026
    restart: always
    healthcheck:
      test: curl --fail -s http://orion:1026/version || exit 1
      interval: 30s
      retries: 15



  timescale:
    image: timescale/timescaledb-ha:pg17-ts2.18
    hostname: timescale_host
    container_name: timescale
    networks:
      - mynet
    privileged: true
    ipc: host
    command: ["postgres", "-c", "log_statement=all"]
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - 5432:5432  
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orion" ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 60s
  
  mintaka:
    image: fiware/mintaka:0.6.18
    hostname: mintaka_host
    container_name: mintaka
    networks:
      - mynet 
    privileged: true
    ipc: host
    environment:
      - MICRONAUT_SERVER_PORT=8080
      - MICRONAUT_METRICS_ENABLED=true
      - ENDPOINTS_ALL_PORT=8080
      - ENDPOINTS_METRICS_ENABLED=true
      - ENDPOINTS_HEALTH_ENABLED=true
      - DATASOURCES_DEFAULT_HOST=timescale
      - DATASOURCES_DEFAULT_PORT=5432
      - DATASOURCES_DEFAULT_USERNAME=orion
      - DATASOURCES_DEFAULT_PASSWORD=orion
      - DATASOURCES_DEFAULT_DATABASE=orion
      - LOGGERS_LEVEL_ROOT=TRACE
    ports:
      - 8080:8080
    restart: always


  grafana:
    image: grafana/grafana
    hostname: grafana_host
    container_name: grafana
    networks:
      - mynet
    privileged: true
    ipc: host
    environment:
      - GF_INSTALL_PLUGINS=marcusolsson-dynamictext-panel
    volumes:
      - ./configs/grafanadashboard/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./configs/grafanadashboard/datasources:/etc/grafana/provisioning/datasources
      - ./configs/grafanadashboard/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    ports:
      - 443:3000
    


volumes:
  mongo_data:
  grafana-storage:



networks:
  mynet:
    driver: bridge     

    